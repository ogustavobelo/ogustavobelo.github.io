baseURL = 'https://www.gustavobelo.com/'
locale = 'pt-BR'
languageName = 'Português'
title = 'Notas de uma mente inquieta'
enableRobotsTXT = true

[markup.goldmark.renderer]
unsafe = true

[mediaTypes."text/markdown"]
suffixes = ['md']

[outputFormats.MARKDOWN]
mediaType = 'text/markdown'
isPlainText = true

# llms.txt / llms-full.txt: plain-text formats read by AI agents/crawlers, not
# by browsers, so they carry no HTML alternate link and use bare .txt names.
[outputFormats.LLMS]
mediaType = 'text/plain'
baseName = 'llms'
isPlainText = true
notAlternative = true

[outputFormats.LLMSFULL]
mediaType = 'text/plain'
baseName = 'llms-full'
isPlainText = true
notAlternative = true

[outputs]
home = ['HTML', 'RSS', 'JSON', 'LLMS', 'LLMSFULL']
page = ['HTML', 'MARKDOWN']

[taxonomies]
tag = 'tags'

[params]
defaultTheme = 'auto'
description = 'Reflexões, ideias e anotações sobre tecnologia, produtividade e curiosidade.'
# Fallback og:image/twitter:image for link previews (WhatsApp, Telegram...) when a page has none.
images = ['android-chrome-512x512.png']

[params.header]
desktopMode = 'fixed'
mobileMode = 'auto'

[params.header.title]
name = 'Notas de uma mente inquieta'

[params.home.profile]
enable = true
subtitle = 'Ideias, opiniões, desabafos de uma cabeça efervescente.'
avatarURL = ''
gravatarEmail = ''
social = false
typeit = true

[params.home.posts]
enable = true
paginate = 6

[params.search]
enable = true
type = 'lunr'
contentLength = 4000
maxResultLength = 10
snippetLength = 30
highlightTag = 'em'
absoluteURL = false

[params.page]
hiddenFromHomePage = false
hiddenFromSearch = false

[params.page.relatedPosts]
enable = true
limit = 5

[params.page.toc]
enable = true
keepStatic = false
auto = true

[params.app]
title = 'Notas de uma mente inquieta'

[params.footer]
enable = true
hugo = false
author = true
copyright = true

# Personal values (contact e-mail, GoatCounter code) are not committed so forks don't inherit them.
# Locally they come from config/_default/params.toml (gitignored; copy params.toml.example).
# In the deploy they come from environment variables filled by GitHub Actions repository variables:
#   HUGO_PARAMS_SOCIAL_EMAIL                 -> e-mail shown in the post contact note
#   HUGO_PARAMS_ANALYTICS_GOATCOUNTER_CODE   -> GoatCounter site code (xxx in xxx.goatcounter.com)
[params.social]
RSS = ''

[params.analytics]
enable = true

# Author config
[params.author]
  name = "Gustavo Belo"
  link = "https://gustavobelo.com"

# Menu config
[menu]
  [[menu.main]]
    weight = 1
    identifier = "posts"
    pre = ""
    post = ""
    name = "Notas"
    url = "/posts/"
    title = ""
  [[menu.main]]
    weight = 2
    identifier = "tags"
    pre = ""
    post = ""
    name = "Tags"
    url = "/tags/"
    title = ""
  [[menu.main]]
    weight = 3
    identifier = "about"
    pre = ""
    post = ""
    name = "Sobre mim"
    url = "/about/"
    title = ""