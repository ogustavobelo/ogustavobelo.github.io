baseURL = 'https://ogustavobelo.github.io/'
locale = 'pt-br'
title = 'Notas de uma mente inquieta'

[markup.goldmark.renderer]
unsafe = true

[outputs]
home = ['HTML', 'RSS', 'JSON']

[taxonomies]
tag = 'tags'

[params]
defaultTheme = 'auto'
description = 'Reflexões, ideias e anotações sobre tecnologia, produtividade e curiosidade.'

[params.header]
desktopMode = 'fixed'
mobileMode = 'auto'

[params.header.title]
name = 'Notas de uma mente inquieta'

[params.home.profile]
enable = true
subtitle = 'Ideias, opiniões, desabafos de uma cabeça efervescente.'
avatarURL = ''
gravatarEmail = ''
social = false
typeit = true

[params.home.posts]
enable = true
paginate = 6

[params.search]
enable = true
type = 'lunr'
contentLength = 4000
maxResultLength = 10
snippetLength = 30
highlightTag = 'em'
absoluteURL = false

[params.page]
hiddenFromHomePage = false
hiddenFromSearch = false

[params.page.relatedPosts]
enable = true
limit = 5

[params.page.toc]
enable = true
keepStatic = false
auto = true

[params.app]
title = 'Notas de uma mente inquieta'

[params.footer]
enable = true
hugo = false
author = true
copyright = true

[params.social]
Email = 'ogustavobelo@gmail.com'
RSS = ''

# language code ["en", "zh-CN", "fr", "pl", ...]
languageCode = "pt-br"
# language name ["English", "简体中文", "Français", "Polski", ...]
languageName = "Português"

# Author config
[author]
  name = "Gustavo Belo"
  email = "ogustavobelo@gmail.com"
  link = "https://gustavobelo.com"

# Menu config
[menu]
  [[menu.main]]
    weight = 1
    identifier = "posts"
    pre = ""
    post = ""
    name = "Notas"
    url = "/posts/"
    title = ""
  [[menu.main]]
    weight = 2
    identifier = "tags"
    pre = ""
    post = ""
    name = "Tags"
    url = "/tags/"
    title = ""
  [[menu.main]]
    weight = 3
    identifier = "about"
    pre = ""
    post = ""
    name = "Sobre mim"
    url = "/about/"
    title = ""